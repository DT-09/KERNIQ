name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kerniq
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kerniq
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kerniq
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_API_SECRET: ci-placeholder
          SHOPIFY_APP_URL: https://localhost
          SCOPES: read_products,read_inventory,read_orders
